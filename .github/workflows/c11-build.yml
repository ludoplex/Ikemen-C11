  status-check:
    name: C11 Build Status
    if: always()
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-and-test.result }}" = "success" ]; then
            echo "✅ C11 build and tests passed"
            exit 0
          else
            echo "❌ C11 build or tests failed"
            exit 1
          fi
